name: Desktop (Windows)

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["desktop-v*"]
    paths:
      - "desktop/**"
      - "innertube/**"
      - "app/src/main/kotlin/com/metrolist/spotify/**"
      - "app/src/main/kotlin/com/metrolist/lrclib/**"
      - "app/src/main/kotlin/com/metrolist/kugou/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "innertube/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  VLC_VERSION: "3.0.21"

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test --stacktrace

      # Bundle libVLC so people don't have to install VLC themselves. Video, GUI and Lua plugins are
      # dropped because Meld only plays audio.
      - name: Download VLC
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\vlc.zip"
          Invoke-WebRequest "https://download.videolan.org/pub/videolan/vlc/$env:VLC_VERSION/win64/vlc-$env:VLC_VERSION-win64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\vlc"
          $src = "$env:RUNNER_TEMP\vlc\vlc-$env:VLC_VERSION"
          $dst = "appResources\windows\vlc"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item "$src\libvlc.dll", "$src\libvlccore.dll" $dst
          Copy-Item "$src\plugins" $dst -Recurse
          foreach ($dir in "gui", "lua", "video_output", "video_filter", "video_splitter", "visualization") {
            Remove-Item "$dst\plugins\$dir" -Recurse -Force -ErrorAction SilentlyContinue
          }
          Copy-Item "$src\COPYING.txt" "$dst\VLC-COPYING.txt"

      - name: Build installer and portable app
        run: ./gradlew packageMsi createDistributable --stacktrace

      - name: Zip portable app
        shell: pwsh
        run: Compress-Archive build\compose\binaries\main\app\Meld -DestinationPath build\Meld-portable-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Meld-windows
          path: |
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/Meld-portable-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/Meld-portable-windows.zip
